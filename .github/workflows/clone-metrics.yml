name: Track Clone Metrics via GitHub App

on:
  workflow_dispatch:

jobs:
  clone-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allows committing results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper branch operations

      - name: Generate GitHub App token
        id: generate_token
        uses: tibdex/github-app-token@v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Switch to metrics branch
        run: |
          # Checkout or create metrics branch
          if git show-ref --verify --quiet refs/remotes/origin/metrics; then
            echo "📋 Checking out existing metrics branch..."
            git checkout -b metrics origin/metrics || git checkout metrics
          else
            echo "🆕 Creating new metrics branch..."
            git checkout -b metrics
          fi

      - name: Fetch clone data via GitHub App
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          mkdir -p .metrics
          # Fetch 14-day rolling metrics
          curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/traffic/clones \
              > .metrics/clone_stats_14d.json
          
          # Fetch single day metrics (last 24 hours)
          curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/traffic/clones?per=day \
              > .metrics/clone_stats_1d.json
          
          echo "14-day metrics:"
          cat .metrics/clone_stats_14d.json
          echo "1-day metrics:"
          cat .metrics/clone_stats_1d.json
        
      - name: Update daily metrics
        run: |
          mkdir -p .metrics
          
          # Extract 1-day metrics (get the most recent day's data)
          COUNT_1D=$(jq '.clones[0].count // 0' .metrics/clone_stats_1d.json)
          UNIQUES_1D=$(jq '.clones[0].uniques // 0' .metrics/clone_stats_1d.json)
          
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DATE_ONLY=$(date -u +"%Y-%m-%d")

          # Create daily CSV with header if it doesn't exist
          if [ ! -f .metrics/daily_clone_metrics.csv ]; then
            echo "date,total_clones,unique_cloners,last_updated" > .metrics/daily_clone_metrics.csv
          fi

          # Check if today's date already exists in the daily CSV
          if grep -q "^$DATE_ONLY" .metrics/daily_clone_metrics.csv; then
            echo "📝 Updating daily entry for $DATE_ONLY..."
            # Update existing entry
            awk -v date="$DATE_ONLY" -v count="$COUNT_1D" -v uniques="$UNIQUES_1D" -v last_updated="$DATE" '
              BEGIN { FS=","; OFS="," }
              /^[0-9]{4}-[0-9]{2}-[0-9]{2}/ && $1 == date { 
                print $1, count, uniques, last_updated; 
                updated=1; 
                next 
              }
              { print }
            ' .metrics/daily_clone_metrics.csv > .metrics/daily_clone_metrics_temp.csv
            mv .metrics/daily_clone_metrics_temp.csv .metrics/daily_clone_metrics.csv
          else
            echo "➕ Adding new daily entry for $DATE_ONLY..."
            echo "$DATE_ONLY,$COUNT_1D,$UNIQUES_1D,$DATE" >> .metrics/daily_clone_metrics.csv
          fi

          echo "Daily metrics:"
          tail -n 3 .metrics/daily_clone_metrics.csv

      - name: Update 14-day rolling metrics
        run: |
          # Extract 14-day metrics
          COUNT_14D=$(jq '.count' .metrics/clone_stats_14d.json)
          UNIQUES_14D=$(jq '.uniques' .metrics/clone_stats_14d.json)
          
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Create 14-day CSV with header if it doesn't exist
          if [ ! -f .metrics/rolling_14d_clone_metrics.csv ]; then
            echo "date,total_clones_14d,unique_cloners_14d,last_updated" > .metrics/rolling_14d_clone_metrics.csv
          fi

          # Always append to 14-day rolling metrics (these are cumulative)
          echo "$DATE,$COUNT_14D,$UNIQUES_14D,$DATE" >> .metrics/rolling_14d_clone_metrics.csv

          echo "14-day rolling metrics:"
          tail -n 3 .metrics/rolling_14d_clone_metrics.csv

      - name: Commit and push results
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config user.name "CloneMetricsBot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add both CSV files
          git add .metrics/daily_clone_metrics.csv .metrics/rolling_14d_clone_metrics.csv
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit - CSV data is up to date"
          else
            echo "📝 Committing changes..."
            git commit -m "Automated update: repository clone metrics $(date)"
            
            echo "🚀 Pushing to metrics branch..."
            git push --force-with-lease origin metrics
          fi
